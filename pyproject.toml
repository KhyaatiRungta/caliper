[project]
name = "caliper"
version = "0.1.0"
description = "An evaluation and observability harness for LLM agents"
requires-python = ">=3.11"
dependencies = ["openai>=1.40.0", "PyYAML>=6.0"]

[project.scripts]
caliper = "caliper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
